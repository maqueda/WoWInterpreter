name: KT07 Decoder Tests

on:
  pull_request:
    paths:
      - "Bridge/kt07_decoder.py"
      - "tests/test_kt07_decoder.py"
      - ".github/workflows/kt07-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kt07-decoder:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        shell: pwsh
        run: python -m pip install Pillow

      - name: Run KT07 decoder regression tests
        shell: pwsh
        run: python -m unittest -v tests.test_kt07_decoder
