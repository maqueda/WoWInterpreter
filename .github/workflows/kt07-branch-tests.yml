name: KT07 Branch Tests
on:
  push:
    branches: ["fix/kt07-adaptive-calibration"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install Pillow
      - run: python -m unittest -v tests.test_kt07_decoder
